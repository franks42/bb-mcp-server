<!DOCTYPE html>
<html>
<head>
  <title>atom-sync Scittle Test</title>
  <script src="https://cdn.jsdelivr.net/npm/scittle@0.6.22/dist/scittle.js"></script>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a2e; color: #eee; }
    pre { background: #16213e; padding: 15px; border-radius: 5px; overflow-x: auto; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
    h1 { color: #818cf8; }
    h2 { color: #a5b4fc; margin-top: 30px; }
  </style>
</head>
<body>
  <h1>atom-sync Scittle Test</h1>
  <p>Testing sync logic in SCI interpreter (same as browser runtime)</p>
  <pre id="output">Running tests...</pre>

  <script type="application/x-scittle">
;; =============================================================================
;; atom-sync.core inlined (Scittle can't load external deps)
;; =============================================================================

(ns atom-sync.core)

(defn deep-diff->ops
  "Recursively diff two values, return assoc-in/dissoc-in ops."
  ([key old-val new-val]
   (deep-diff->ops key [] old-val new-val))
  ([key path old-val new-val]
   (cond
     (= old-val new-val)
     []

     (and (map? old-val) (map? new-val))
     (let [all-keys (into (set (keys old-val)) (keys new-val))]
       (vec
        (mapcat
         (fn [k]
           (let [ov (get old-val k ::missing)
                 nv (get new-val k ::missing)
                 path' (conj path k)]
             (cond
               (= ov nv) []
               (= nv ::missing) [[:sync/op {:key key :op :dissoc-in :path path'}]]
               (= ov ::missing) [[:sync/op {:key key :op :assoc-in :path path' :value nv}]]
               :else (deep-diff->ops key path' ov nv))))
         all-keys)))

     :else
     [[:sync/op {:key key :op :assoc-in :path path :value new-val}]])))

(defn apply-sync-op
  "Apply a sync op to a target atom."
  [target-atom op]
  (let [[_sync-op {:keys [op path value]}] op]
    (case op
      :assoc-in
      (if (empty? path)
        (reset! target-atom value)
        (swap! target-atom assoc-in path value))

      :dissoc-in
      (if (= 1 (count path))
        (swap! target-atom dissoc (first path))
        (swap! target-atom update-in (butlast path) dissoc (last path)))

      (do
        (js/console.warn "[atom-sync] Unknown op:" op)
        @target-atom))))

;; Registry
(defonce !synced-atoms (atom {}))
(defonce !subscribers (atom {}))

(defn- notify-subscribers! [ops]
  (when (seq ops)
    (doseq [[_sub-key callback] @!subscribers]
      (try
        (callback ops)
        (catch :default e
          (js/console.error "[atom-sync] Subscriber error:" e))))))

(defn- on-atom-change [key _ref old-val new-val]
  (when (not= old-val new-val)
    (let [{:keys [seq]} (get @!synced-atoms key)
          new-seq (inc (or seq 0))
          ops (mapv
               (fn [[op-type op-data]]
                 [op-type (assoc op-data :seq new-seq)])
               (deep-diff->ops key old-val new-val))]
      (swap! !synced-atoms update key assoc
             :seq new-seq
             :last-value new-val)
      (notify-subscribers! ops))))

(defn register-synced-atom! [key atom-ref]
  (let [current-val @atom-ref]
    (swap! !synced-atoms assoc key
           {:atom atom-ref
            :seq 0
            :last-value current-val})
    (add-watch atom-ref [::sync key]
               (fn [_key ref old-val new-val]
                 (on-atom-change key ref old-val new-val)))
    key))

(defn unregister-synced-atom! [key]
  (when-let [{:keys [atom]} (get @!synced-atoms key)]
    (remove-watch atom [::sync key]))
  (swap! !synced-atoms dissoc key)
  key)

(defn subscribe! [subscriber-key callback-fn]
  (swap! !subscribers assoc subscriber-key callback-fn)
  subscriber-key)

(defn unsubscribe! [subscriber-key]
  (swap! !subscribers dissoc subscriber-key)
  subscriber-key)

(defn reset-all! []
  (doseq [key (keys @!synced-atoms)]
    (unregister-synced-atom! key))
  (reset! !subscribers {})
  nil)

(defn get-sync-status []
  (into {}
        (map (fn [[k {:keys [seq]}]] [k seq]))
        @!synced-atoms))

(defn generate-full-sync-ops
  "Generate full sync ops for an atom (path [])."
  [key]
  (when-let [{:keys [atom seq]} (get @!synced-atoms key)]
    [[:sync/op {:key key
                :seq seq
                :op :assoc-in
                :path []
                :value @atom}]]))

;; =============================================================================
;; Seq Validation (Client-Side)
;; =============================================================================

(defn apply-sync-op-validated
  "Apply op with seq validation. Returns :applied, :stale, or :gap"
  [target-atom op expected-seqs]
  (let [[_ {:keys [key seq]}] op
        expected (inc (get @expected-seqs key 0))]
    (cond
      ;; Normal: sequential
      (= seq expected)
      (do
        (apply-sync-op target-atom op)
        (swap! expected-seqs assoc key seq)
        :applied)

      ;; Stale: already seen or old
      (< seq expected)
      :stale

      ;; Gap: missed some updates, apply anyway
      :else
      (do
        (apply-sync-op target-atom op)
        (swap! expected-seqs assoc key seq)
        :gap))))

(defn reset-expected-seq!
  "Reset expected seq for a key. Use after receiving full resync."
  [expected-seqs key seq]
  (swap! expected-seqs assoc key seq))

;; =============================================================================
;; Heartbeat / Sync Check (Server-Side)
;; =============================================================================

(defn get-server-seq
  "Get current server seq for an atom key."
  [key]
  (get-in @!synced-atoms [key :seq]))

(defn check-sync-status
  "Check if client is in sync with server."
  [key client-seq]
  (if-let [server-seq (get-server-seq key)]
    (cond
      (= client-seq server-seq) :in-sync
      (< client-seq server-seq) :behind
      :else :ahead)
    :unknown))

(defn handle-heartbeat
  "Handle heartbeat request from client."
  [key client-seq]
  (let [status (check-sync-status key client-seq)
        server-seq (get-server-seq key)]
    {:status status
     :server-seq server-seq
     :resync-ops (when (= status :behind)
                   (generate-full-sync-ops key))}))

;; =============================================================================
;; Tests
;; =============================================================================

(ns test-runner
  (:require [atom-sync.core :as core]))

(defn test-result [name passed? details]
  {:name name :passed? passed? :details details})

(defn run-tests []
  (let [results (atom [])]

    ;; Test 1: deep-diff->ops flat map
    (let [ops (core/deep-diff->ops :s {:a 1 :b 2} {:a 1 :b 99 :c 3})]
      (swap! results conj
             (test-result "deep-diff->ops flat map"
                          (and (= 2 (count ops))
                               (some #(= [:sync/op {:key :s :op :assoc-in :path [:b] :value 99}] %) ops)
                               (some #(= [:sync/op {:key :s :op :assoc-in :path [:c] :value 3}] %) ops))
                          (pr-str ops))))

    ;; Test 2: deep-diff->ops nested map
    (let [ops (core/deep-diff->ops :s
                {:user {:name "old" :age 30}}
                {:user {:name "new" :age 30}})]
      (swap! results conj
             (test-result "deep-diff->ops nested map"
                          (= [[:sync/op {:key :s :op :assoc-in :path [:user :name] :value "new"}]] ops)
                          (pr-str ops))))

    ;; Test 3: deep-diff->ops removal
    (let [ops (core/deep-diff->ops :s {:a 1 :b 2} {:a 1})]
      (swap! results conj
             (test-result "deep-diff->ops removal"
                          (= [[:sync/op {:key :s :op :dissoc-in :path [:b]}]] ops)
                          (pr-str ops))))

    ;; Test 4: deep-diff->ops vectors replaced wholesale
    (let [ops (core/deep-diff->ops :s {:items [1 2 3]} {:items [1 2 3 4]})]
      (swap! results conj
             (test-result "deep-diff->ops vectors wholesale"
                          (= [[:sync/op {:key :s :op :assoc-in :path [:items] :value [1 2 3 4]}]] ops)
                          (pr-str ops))))

    ;; Test 5: apply-sync-op assoc-in
    (let [a (atom {:a 1})]
      (core/apply-sync-op a [:sync/op {:op :assoc-in :path [:b] :value 2}])
      (swap! results conj
             (test-result "apply-sync-op assoc-in"
                          (= {:a 1 :b 2} @a)
                          (pr-str @a))))

    ;; Test 6: apply-sync-op full replace
    (let [a (atom {:old "value"})]
      (core/apply-sync-op a [:sync/op {:op :assoc-in :path [] :value {:new "value"}}])
      (swap! results conj
             (test-result "apply-sync-op full replace"
                          (= {:new "value"} @a)
                          (pr-str @a))))

    ;; Test 7: apply-sync-op dissoc-in
    (let [a (atom {:a 1 :b 2})]
      (core/apply-sync-op a [:sync/op {:op :dissoc-in :path [:b]}])
      (swap! results conj
             (test-result "apply-sync-op dissoc-in"
                          (= {:a 1} @a)
                          (pr-str @a))))

    ;; Test 8: roundtrip (diff then apply)
    (let [old {:user {:name "old" :age 30} :count 1}
          new {:user {:name "new" :age 30} :count 2}
          ops (core/deep-diff->ops :s old new)
          result (atom old)]
      (doseq [op ops]
        (core/apply-sync-op result op))
      (swap! results conj
             (test-result "roundtrip diff->apply"
                          (= new @result)
                          (str "ops: " (pr-str ops) " result: " (pr-str @result)))))

    ;; Test 9: Local two-atom sync
    (core/reset-all!)
    (let [!source (atom {:count 0})
          !target (atom nil)
          received-ops (atom [])]
      (core/subscribe! :test-sub
                       (fn [ops]
                         (swap! received-ops into ops)
                         (doseq [op ops]
                           (core/apply-sync-op !target op))))
      (core/register-synced-atom! :my-state !source)
      (swap! !source assoc :count 1)
      (swap! results conj
             (test-result "local two-atom sync"
                          (and (= {:count 1} @!target)
                               (= 1 (count @received-ops)))
                          (str "target: " (pr-str @!target) " ops: " (count @received-ops)))))

    ;; Test 10: Multiple changes with sequential seqs
    (core/reset-all!)
    (let [!source (atom {:x 0})
          received-seqs (atom [])]
      (core/subscribe! :test-sub
                       (fn [ops]
                         (doseq [[_ {:keys [seq]}] ops]
                           (swap! received-seqs conj seq))))
      (core/register-synced-atom! :s !source)
      (swap! !source assoc :x 1)
      (swap! !source assoc :x 2)
      (swap! !source assoc :x 3)
      (swap! results conj
             (test-result "sequential seqs"
                          (= [1 2 3] @received-seqs)
                          (pr-str @received-seqs))))

    ;; Test 11: Falsey values (nil)
    (let [ops (core/deep-diff->ops :s {:a 1} {:a nil})]
      (swap! results conj
             (test-result "falsey value (nil)"
                          (= [[:sync/op {:key :s :op :assoc-in :path [:a] :value nil}]] ops)
                          (pr-str ops))))

    ;; Test 12: Falsey values (false)
    (let [ops (core/deep-diff->ops :s {:a true} {:a false})]
      (swap! results conj
             (test-result "falsey value (false)"
                          (= [[:sync/op {:key :s :op :assoc-in :path [:a] :value false}]] ops)
                          (pr-str ops))))

    ;; Test 13: apply-sync-op-validated normal
    (let [!target (atom nil)
          !seqs (atom {})
          op [:sync/op {:key :s :seq 1 :op :assoc-in :path [] :value {:x 1}}]
          result (core/apply-sync-op-validated !target op !seqs)]
      (swap! results conj
             (test-result "apply-sync-op-validated normal"
                          (and (= :applied result)
                               (= {:x 1} @!target)
                               (= {:s 1} @!seqs))
                          (str "result: " result " target: " (pr-str @!target) " seqs: " (pr-str @!seqs)))))

    ;; Test 14: apply-sync-op-validated stale
    (let [!target (atom {:x 1})
          !seqs (atom {:s 5})
          op [:sync/op {:key :s :seq 3 :op :assoc-in :path [:x] :value 99}]
          result (core/apply-sync-op-validated !target op !seqs)]
      (swap! results conj
             (test-result "apply-sync-op-validated stale"
                          (and (= :stale result)
                               (= {:x 1} @!target)
                               (= {:s 5} @!seqs))
                          (str "result: " result " target: " (pr-str @!target)))))

    ;; Test 15: apply-sync-op-validated gap
    (let [!target (atom {:x 1})
          !seqs (atom {:s 1})
          op [:sync/op {:key :s :seq 5 :op :assoc-in :path [:x] :value 99}]
          result (core/apply-sync-op-validated !target op !seqs)]
      (swap! results conj
             (test-result "apply-sync-op-validated gap"
                          (and (= :gap result)
                               (= {:x 99} @!target)
                               (= {:s 5} @!seqs))
                          (str "result: " result " target: " (pr-str @!target) " seqs: " (pr-str @!seqs)))))

    ;; Test 16: reset-expected-seq!
    (let [!seqs (atom {:s 5 :t 3})]
      (core/reset-expected-seq! !seqs :s 10)
      (swap! results conj
             (test-result "reset-expected-seq!"
                          (= {:s 10 :t 3} @!seqs)
                          (pr-str @!seqs))))

    ;; Test 17: get-server-seq
    (core/reset-all!)
    (let [!source (atom {:x 1})]
      (core/register-synced-atom! :test-atom !source)
      (swap! !source assoc :x 2)
      (swap! !source assoc :x 3)
      (let [seq (core/get-server-seq :test-atom)]
        (swap! results conj
               (test-result "get-server-seq"
                            (= 2 seq)
                            (str "seq: " seq)))))

    ;; Test 18: check-sync-status in-sync
    (core/reset-all!)
    (let [!source (atom {:x 1})]
      (core/register-synced-atom! :s !source)
      (swap! !source assoc :x 2)
      (let [status (core/check-sync-status :s 1)]
        (swap! results conj
               (test-result "check-sync-status in-sync"
                            (= :in-sync status)
                            (str "status: " status)))))

    ;; Test 19: check-sync-status behind
    (core/reset-all!)
    (let [!source (atom {:x 1})]
      (core/register-synced-atom! :s !source)
      (swap! !source assoc :x 2)
      (swap! !source assoc :x 3)
      (swap! !source assoc :x 4)
      (let [status (core/check-sync-status :s 1)]
        (swap! results conj
               (test-result "check-sync-status behind"
                            (= :behind status)
                            (str "status: " status " server-seq: " (core/get-server-seq :s))))))

    ;; Test 20: handle-heartbeat in-sync
    (core/reset-all!)
    (let [!source (atom {:x 1})]
      (core/register-synced-atom! :s !source)
      (swap! !source assoc :x 2)
      (let [response (core/handle-heartbeat :s 1)]
        (swap! results conj
               (test-result "handle-heartbeat in-sync"
                            (and (= :in-sync (:status response))
                                 (= 1 (:server-seq response))
                                 (nil? (:resync-ops response)))
                            (pr-str response)))))

    ;; Test 21: handle-heartbeat behind with resync
    (core/reset-all!)
    (let [!source (atom {:x 1})]
      (core/register-synced-atom! :s !source)
      (swap! !source assoc :x 2)
      (swap! !source assoc :x 3)
      (let [response (core/handle-heartbeat :s 1)]
        (swap! results conj
               (test-result "handle-heartbeat behind with resync"
                            (and (= :behind (:status response))
                                 (= 2 (:server-seq response))
                                 (= 1 (count (:resync-ops response)))
                                 (= [:sync/op {:key :s :seq 2 :op :assoc-in :path [] :value {:x 3}}]
                                    (first (:resync-ops response))))
                            (pr-str response)))))

    ;; Cleanup
    (core/reset-all!)

    @results))

;; =============================================================================
;; Display Results
;; =============================================================================

(let [output (js/document.getElementById "output")
      results (run-tests)
      passed (count (filter :passed? results))
      total (count results)
      all-ok (= passed total)]
  (set! (.-innerHTML output)
        (str "=== atom-sync Scittle Test ===\n\n"
             (clojure.string/join "\n"
               (map (fn [{:keys [name passed? details]}]
                      (str (if passed?
                             (str "<span class=\"pass\">\u2713 PASS</span>")
                             (str "<span class=\"fail\">\u2717 FAIL</span>"))
                           " " name "\n"
                           "  " details))
                    results))
             "\n\n"
             "─────────────────────────────────────\n"
             (if all-ok
               (str "<span class=\"pass\">All " total " tests passed!</span>")
               (str "<span class=\"fail\">" passed "/" total " tests passed</span>")))))
  </script>
</body>
</html>
